[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spif"
version = "1.0.0"
description = "Semantic Provenance Inference Format — a binary file format for AI outputs with provenance, uncertainty, and signatures"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Brainex", email = "hello@brainex.ai"},
]
keywords = ["ai", "llm", "binary-format", "provenance", "signatures", "audit", "agents", "compliance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: File Formats",
]
dependencies = [
    "cbor2>=5.9.0,<7",
    "typer>=0.12",
    "cryptography>=50.0.0",
    "msgpack>=1.2.1",
]

[project.optional-dependencies]
verify = []                             # verify-only: all deps already in core (cbor2 + cryptography)
anthropic = ["anthropic>=0.36"]
openai = ["openai>=1.45"]
gemini = ["google-generativeai>=0.8"]
mcp = ["anthropic>=0.36", "fastmcp>=2.0"]
dev = ["pytest>=8", "pytest-cov", "hypothesis>=6"]

[project.scripts]
spif = "spif.cli:app"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "live: marks tests that require live API keys",
]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["spif*"]
