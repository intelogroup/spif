[package]
name = "spif-rust"
version = "0.2.0"
edition = "2021"
description = "Semantic Provenance Inference Format (SPIF) — Rust implementation. Binary format for AI outputs with provenance, uncertainty distributions, reasoning traces, and ed25519 signatures."
license = "Apache-2.0"
repository = "https://github.com/brainex-ai/spif"
documentation = "https://docs.rs/spif-rust"
keywords = ["ai", "llm", "binary-format", "provenance", "agents"]
categories = ["encoding", "science::ml"]
readme = "README.md"

[lib]
name = "spif_rust"
crate-type = ["rlib", "cdylib", "staticlib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
ciborium = "0.2"
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
byteorder = "1.5"
ed25519-dalek = "3.0"
flate2 = "1.0"
# NOTE: The four deps below are only used in src/bin/bench_speed.rs.
# They belong in dev-dependencies but cargo does not make those available to
# [[bin]] targets. The correct long-term fix is to move bench_speed into a
# separate workspace crate or use `benches/` + criterion.
serde_json = "1.0"
rmp-serde = "1.3"
rmpv = { version = "1.3", features = ["with-serde"] }
bson = "2.13"
quick-xml = { version = "0.41", features = ["serialize"] }
serde_yaml = "0.9"
toml = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tiny_http = "0.12.0"
ureq = { version = "2.9", features = ["json"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[[bin]]
name = "bench_speed"
path = "src/bin/bench_speed.rs"

[[bin]]
name = "spif-sidecar"
path = "src/bin/sidecar.rs"

[[bin]]
name = "crypto_conformance"
path = "src/bin/crypto_conformance.rs"

[[bin]]
name = "tamper_detect"
path = "src/bin/tamper_detect.rs"