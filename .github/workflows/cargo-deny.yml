name: cargo-deny

on:
  push:
    paths:
      - "spif-rust/**"
      - ".github/workflows/cargo-deny.yml"
  pull_request:
    paths:
      - "spif-rust/**"
      - ".github/workflows/cargo-deny.yml"
  schedule:
    # Advisory DB changes daily even when the codebase doesn't — catch a newly
    # published CVE against an existing pinned dependency, not just new ones.
    - cron: "0 4 * * *"

permissions:
  contents: read

defaults:
  run:
    working-directory: spif-rust

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned to same commit as spif-rust-test.yml
        with:
          toolchain: stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        run: cargo deny check
