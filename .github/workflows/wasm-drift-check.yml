name: WASM drift check

on:
  pull_request:
    branches: ["main"]
    paths:
      - "spif-rust/src/**"
      - "spif-rust/Cargo.toml"
      - "verify/pkg/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Rebuild wasm package
        working-directory: spif-rust
        run: wasm-pack build --target web --out-dir pkg

      - name: Diff against committed verify/pkg
        run: |
          rm -f spif-rust/pkg/.gitignore
          if ! diff -rq spif-rust/pkg verify/pkg -x '*.md' -x package.json; then
            echo "::error::verify/pkg is stale relative to spif-rust/src. Rebuild with 'wasm-pack build --target web --out-dir pkg' in spif-rust/, copy to verify/pkg, and commit."
            exit 1
          fi
