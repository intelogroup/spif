name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
        working-directory: spif-py
      - name: Verify localhost socket support for integration tests
        working-directory: spif-py
        run: python -c "import socket; s=socket.socket(); s.bind(('127.0.0.1', 0)); s.close()"
      - run: make test
        working-directory: spif-py
