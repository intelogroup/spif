name: spif-rust fuzz

on:
  push:
    paths:
      - "spif-rust/**"
      - ".github/workflows/spif-rust-fuzz.yml"
  pull_request:
    paths:
      - "spif-rust/**"
      - ".github/workflows/spif-rust-fuzz.yml"
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

defaults:
  run:
    working-directory: spif-rust

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_read
          - fuzz_read_strict
          - fuzz_stream
          - fuzz_stream_strict
          - fuzz_verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # dtolnay/rust-toolchain, pinned to same commit as spif-rust-test.yml
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # PRs/pushes get a short regression smoke run; the nightly schedule digs deeper.
      - name: Determine fuzz duration
        id: duration
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "seconds=1200" >> "$GITHUB_OUTPUT"
          else
            echo "seconds=60" >> "$GITHUB_OUTPUT"
          fi
      - name: Run ${{ matrix.target }}
        run: |
          cargo fuzz run --fuzz-dir fuzz-libfuzzer "${{ matrix.target }}" \
            fuzz-libfuzzer/seeds \
            -- -max_total_time="${{ steps.duration.outputs.seconds }}"
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: spif-rust/fuzz-libfuzzer/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
