name: Deploy verifier to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "verify/**"
      - "spif-rust/src/**"
      - "spif-rust/Cargo.toml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Assert Ghost Verifier is local-only
        working-directory: verify
        run: |
          if rg -n 'fetch\\(|XMLHttpRequest|sendBeacon|/api/verify|/api/validate' index.html; then
            echo "Ghost Verifier must not contain network verification APIs"
            exit 1
          fi

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1

      - name: Build wasm verifier package
        working-directory: spif-rust
        run: wasm-pack build --target web --out-dir ../verify/pkg

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: verify

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
