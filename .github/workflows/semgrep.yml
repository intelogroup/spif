name: semgrep

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install semgrep
        run: pip install semgrep
      # Non-blocking for now: this is semgrep's first pass over the repo, and its
      # default rulesets (registry-pulled, so findings can shift with rule updates
      # outside our control) haven't been triaged yet. Findings are surfaced in the
      # job log and as a SARIF upload for the Security tab; flip continue-on-error
      # to false once a baseline pass has been reviewed and false positives ignored.
      - name: Run semgrep (registry rulesets, informational)
        continue-on-error: true
        run: |
          semgrep scan \
            --config=p/rust \
            --config=p/python \
            --config=p/security-audit \
            --config=p/secrets \
            --sarif --output=semgrep.sarif \
            .
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true
