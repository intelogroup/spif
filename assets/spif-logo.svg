<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 164" role="img" aria-labelledby="title desc">
  <title id="title">SPIF logo</title>
  <desc id="desc">SPIF wordmark beside a single folded provenance path.</desc>
  <defs>
    <linearGradient id="path" x1="30" y1="36" x2="174" y2="132" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="760" height="164" rx="28" fill="#0B1220"/>
  <g transform="translate(30 30)">
    <path d="M18 24h58l30 30-30 30H52l30 30h58" fill="none" stroke="url(#path)" stroke-linecap="round" stroke-linejoin="round" stroke-width="14"/>
    <circle cx="140" cy="114" r="9" fill="#34D399"/>
  </g>
  <text x="212" y="103" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="7">SPIF</text>
  <text x="218" y="134" fill="#A7B0C0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3">SIGNED PROVENANCE</text>
</svg>
