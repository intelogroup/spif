<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">SPIF provenance flow</title>
  <desc id="desc">A prompt flows through a model, tools, and an agent into a signed, sealed output.</desc>
  <g fill="none" stroke="#0F172A" stroke-width="2">
    <rect x="40" y="72" width="180" height="116" rx="4"/>
    <rect x="288" y="72" width="180" height="116" rx="4"/>
    <rect x="536" y="72" width="180" height="116" rx="4"/>
    <rect x="784" y="72" width="180" height="116" rx="4"/>
  </g>
  <g stroke="#0F172A" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M220 130h60"/>
    <path d="m264 118 16 12-16 12"/>
    <path d="M468 130h60"/>
    <path d="m512 118 16 12-16 12"/>
    <path d="M716 130h60"/>
    <path d="m760 118 16 12-16 12"/>
    <path d="M964 130h44"/>
    <path d="m992 118 16 12-16 12"/>
  </g>
  <g fill="#0F172A" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="130" y="120" font-size="20" font-weight="700" letter-spacing="1">PROMPT</text>
    <text x="130" y="148" fill="#6B7280" font-size="13">input context</text>
    <text x="378" y="120" font-size="20" font-weight="700" letter-spacing="1">MODEL</text>
    <text x="378" y="148" fill="#6B7280" font-size="13">generation</text>
    <text x="626" y="120" font-size="20" font-weight="700" letter-spacing="1">TOOLS</text>
    <text x="626" y="148" fill="#6B7280" font-size="13">retrieval + actions</text>
    <text x="874" y="120" font-size="20" font-weight="700" letter-spacing="1">AGENT</text>
    <text x="874" y="148" fill="#6B7280" font-size="13">handoffs + decisions</text>
  </g>
  <path d="M1080 60 L1132 142 L1028 142 Z M1080 60 L1080 90 L1100 104 Z"
        fill="#0F172A" fill-rule="evenodd"/>
  <g fill="#0F172A" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="1080" y="182" font-size="18" font-weight="700" letter-spacing="1">SIGNED</text>
    <text x="1080" y="204" fill="#6B7280" font-size="13">.spif artifact</text>
  </g>
</svg>
