<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPIF Verifier</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 720px; margin: 4rem auto; padding: 0 1.5rem;
  }
  h1 { font-size: 1.3rem; margin-bottom: 0.25rem; }
  p.sub { color: #888; margin-top: 0; }
  #drop {
    border: 2px dashed #888; border-radius: 8px; padding: 3rem 1rem;
    text-align: center; cursor: pointer; margin: 1.5rem 0;
  }
  #drop.hover { border-color: #4a9; }
  #result { display: none; }
  .badge {
    display: inline-block; padding: 0.2rem 0.6rem; border-radius: 4px;
    font-weight: 600; font-size: 0.85rem;
  }
  .ok { background: #1a7f37; color: #fff; }
  .bad { background: #cf222e; color: #fff; }
  .warn { background: #9a6700; color: #fff; }
  pre {
    background: #1112; border-radius: 6px; padding: 1rem;
    overflow-x: auto; font-size: 0.8rem; max-height: 400px;
  }
  #err { color: #cf222e; display: none; }
  input[type=file] { display: none; }
</style>
</head>
<body>

<h1>SPIF Verifier</h1>
<p class="sub">Drop a .spif file below. Verification runs entirely in your browser — nothing is uploaded.</p>

<div id="drop">Drop .spif file here, or click to choose<input type="file" id="file" accept=".spif"></div>

<div id="err"></div>

<div id="result">
  <p><span id="signed-badge" class="badge"></span> <span id="verified-badge" class="badge"></span></p>
  <pre id="json"></pre>
</div>

<script type="module">
import init, { verify } from "./pkg/spif_rust.js";

const drop = document.getElementById("drop");
const fileInput = document.getElementById("file");
const result = document.getElementById("result");
const errBox = document.getElementById("err");
const jsonBox = document.getElementById("json");
const signedBadge = document.getElementById("signed-badge");
const verifiedBadge = document.getElementById("verified-badge");

let ready = init();

drop.addEventListener("click", () => fileInput.click());
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("hover"); });
drop.addEventListener("dragleave", () => drop.classList.remove("hover"));
drop.addEventListener("drop", (e) => {
  e.preventDefault();
  drop.classList.remove("hover");
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", () => {
  if (fileInput.files[0]) handleFile(fileInput.files[0]);
});

async function handleFile(file) {
  await ready;
  errBox.style.display = "none";
  result.style.display = "none";
  try {
    const bytes = new Uint8Array(await file.arrayBuffer());
    const jsonStr = verify(bytes);
    const doc = JSON.parse(jsonStr);

    signedBadge.textContent = doc._signed ? "signed" : "unsigned";
    signedBadge.className = "badge " + (doc._signed ? "ok" : "warn");

    if (doc._signed) {
      verifiedBadge.textContent = doc._verified ? "signature verified" : "signature INVALID";
      verifiedBadge.className = "badge " + (doc._verified ? "ok" : "bad");
      verifiedBadge.style.display = "inline-block";
    } else {
      verifiedBadge.style.display = "none";
    }

    jsonBox.textContent = jsonStr;
    result.style.display = "block";
  } catch (e) {
    errBox.textContent = "Parse failed: " + e.message;
    errBox.style.display = "block";
  }
}
</script>
</body>
</html>
